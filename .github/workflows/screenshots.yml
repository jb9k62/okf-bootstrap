name: screenshots

# Regenerates the README images (docs/images) from the demo bundle. When they changed, it
# commits them to the chore/screenshots branch (never to main, so main only moves when a person
# moves it) and opens a pull request for that branch if none is open. The branch is rebuilt
# from main on every run, so it is always main plus one commit. Runs by hand, and on main when
# the viewer (or code underneath it), the widgets, the demo bundle or the screenshot tool
# itself changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The viewer and everything it imports (okf-core -> okf-rank, okf-edukai-hook -> okf-rank).
      - skills/okf-bootstrap/assets/okf-view.mts
      - skills/okf-bootstrap/assets/okf-core.mts
      - skills/okf-bootstrap/assets/okf-rank.mts
      - skills/okf-bootstrap/assets/okf-edukai-hook.mts
      # The widget bundle inlined into the viewer and built by the screenshots script.
      - skills/okf-bootstrap/assets/templates/okf-widgets/**
      # The bundle the shots are taken from, and the tool that takes them.
      - examples/demo/**
      - scripts/screenshots.mts
      # Build and dependency inputs for both of the above.
      - package.json
      - package-lock.json
      - .github/workflows/screenshots.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The viewer uses system-ui. Pin it to Noto Sans, so the images do not change font
      # depending on what the runner image happens to prefer.
      - name: Fonts
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f
      - run: npm run screenshots
      - name: Commit changed images to chore/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/screenshots
        run: |
          if [ -z "$(git status --porcelain -- docs/images)" ]; then
            echo "Images unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "Regenerate README screenshots"
          # The branch is this run's commit on top of the main it was built from: an older
          # run's images are replaced, not stacked.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed $BRANCH. Merge it into main to publish the images." >> "$GITHUB_STEP_SUMMARY"
          # A pull request is a convenience. The repository may not let Actions open one
          # (Settings > Actions > General), and the branch is there either way.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Regenerate README screenshots" \
              --body "Generated by the screenshots workflow from the demo bundle. Rebuilt from main on every run." \
              || echo "Could not open a pull request; merge $BRANCH by hand." >> "$GITHUB_STEP_SUMMARY"
          fi
